name: Homepage aktualisieren

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'   # täglich 04:17 UTC: neue Einträge im Sheet übernehmen
  workflow_dispatch:        # Knopf „Run workflow“ unter Actions
  repository_dispatch:
    types: [sheet-updated]  # optional: Menü im Google Sheet (tools/apps-script.gs)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Seite zusammenstellen
        # Versionsnummer an CSS/JS hängen, damit Browser nach einem Update nicht die alte Fassung aus dem Cache nehmen
        run: |
          cp -r site _site
          V=${GITHUB_SHA::8}
          sed -i -E "s#(assets/(css|js)/[a-z]+\.(css|js))\"#\1?v=$V\"#g" _site/index.html
          sed -i -E "s#from '\./([a-z]+)\.js'#from './\1.js?v=$V'#g" _site/assets/js/*.js
      - name: Foto-Cache laden
        uses: actions/cache@v5
        with:
          path: .photo-cache
          key: photos-${{ github.run_id }}
          restore-keys: photos-
      - name: Daten aus dem Sheet holen und verschlüsseln
        env:
          SHEET_PUBLISH_URL: ${{ secrets.SHEET_PUBLISH_URL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          PHOTO_FOLDER_ID: ${{ secrets.PHOTO_FOLDER_ID }}
        run: node scripts/build-data.mjs --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
