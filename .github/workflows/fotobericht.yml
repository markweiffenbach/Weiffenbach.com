name: Fotobericht (einmalig)

on:
  push:
    branches: [claude/schiffsurlaube-dashboard-db0j50]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
