name: Fotobericht (einmalig)

on:
  push:
    branches: [claude/schiffsurlaube-dashboard-db0j50]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: .photo-cache
          key: photos-none
          restore-keys: photos-
      - name: Nicht zugeordnete Fotos ermitteln (nur IDs)
        env:
          SHEET_PUBLISH_URL: ${{ secrets.SHEET_PUBLISH_URL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          PHOTO_FOLDER_ID: ${{ secrets.PHOTO_FOLDER_ID }}
          PHOTO_REPORT: ${{ runner.temp }}/report.json
        run: |
          node scripts/build-data.mjs --out "$RUNNER_TEMP/site" > /dev/null
          # Nur Drive-IDs (ohne Namen und Datum) – für den Ordner ohne Freigabe nutzlos
          jq -r '.[] | "FOTO\t\(.why)\t\(.id)"' "$PHOTO_REPORT"
